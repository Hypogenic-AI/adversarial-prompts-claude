idea:
  title: Is it easier or harder to hide adversarial prompts in longer documents?
  domain: nlp
  hypothesis: 'The effectiveness of hiding adversarial prompts within long documents
    depends on whether increased document length introduces enough noise to override
    the adversarial effect, or if it provides more space to conceal such instructions,
    potentially making them harder to detect.

    '
  background:
    description: 'Adversarial prompts can manipulate large language models (LLMs)
      to perform unintended actions, such as providing restricted information or executing
      code. This idea explores whether embedding such adversarial instructions in
      longer documents makes them easier or harder to hide, considering the potential
      for increased noise versus increased opportunity for concealment.

      '
  metadata:
